# Configuração do Netlify (https://docs.netlify.com/configure-builds/file-based-configuration/)
#
# O Netlify corre o build e publica a pasta dist/ (uma cópia do site sem os ficheiros de desenvolvimento:
# build.js, templates de app/, package.json, node_modules, ...; ver DIST_EXCLUDE no build.js).
# A loja (Stripe) usa a função netlify/functions/create-checkout-session.mjs, que precisa da
# variável de ambiente STRIPE_SECRET_KEY (Site configuration > Environment variables).

[build]
  command = "npm run netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
