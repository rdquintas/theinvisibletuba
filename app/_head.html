    <!-- <script type="text/javascript" data-cmp-ab="1" src="https://cdn.consentmanager.net/delivery/autoblocking/d5f65c4162a39.js" data-cmp-host="a.delivery.consentmanager.net" data-cmp-cdn="cdn.consentmanager.net" data-cmp-codesrc="0"></script> -->
 
    <!-- Google tag (gtag.js) -->
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // RGPD: sem cookies até a pessoa aceitar no banner (cookie-banner.js);
    // quem já aceitou antes fica com o consentimento guardado no localStorage
    var cookiesAceites = false;
    try { cookiesAceites = localStorage.getItem('web_dev_isCookieAccepted') === 'yes'; } catch (e) {}
    var consentimento = cookiesAceites ? 'granted' : 'denied';
    gtag('consent', 'default', {
        ad_storage: consentimento,
        ad_user_data: consentimento,
        ad_personalization: consentimento,
        analytics_storage: consentimento
    });
    gtag('js', new Date());

    gtag('config', 'G-R49G5Y633V');

    // o gtag.js só é descarregado depois de aceitar os cookies: aqui, se já
    // aceitou numa visita anterior, ou no "Aceitar" do banner (cookie-banner.js)
    function carregarGA() {
        if (window.gaCarregado) return;
        window.gaCarregado = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-R49G5Y633V';
        document.head.appendChild(s);
    }
    if (cookiesAceites) carregarGA();
    </script>
    
    <meta charset="utf-8" />
    <title>{{ page_title or "The Invisible Tuba" }}</title>
    <link rel="shortcut icon" type="image/ico" href="{{ root }}favicon.png" />
    <meta name="description" content="{{ page_description or 'THE INVISIBLE TUBA is the most entertaining band from Lisbon' }}"  />
    {% if og %}
    <!-- Partilha (WhatsApp, Facebook, X...) -->
    <link rel="canonical" href="{{ og.url }}" />
    {% if og.alt_url %}
    <!-- versões por língua: a própria página, a outra língua e a por defeito (PT) -->
    <link rel="alternate" hreflang="{{ og.lang }}" href="{{ og.url }}" />
    <link rel="alternate" hreflang="{{ og.alt_lang }}" href="{{ og.alt_url }}" />
    <link rel="alternate" hreflang="x-default" href="{{ og.url if og.lang == 'pt' else og.alt_url }}" />
    {% endif %}
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Invisible Tuba" />
    <meta property="og:locale" content="{{ og.locale }}" />
    <meta property="og:url" content="{{ og.url }}" />
    <meta property="og:title" content="{{ og.title }}" />
    <meta property="og:description" content="{{ og.description }}" />
    <meta property="og:image" content="{{ og.image }}" />
    {% if og.image_type %}
    <meta property="og:image:type" content="{{ og.image_type }}" />
    {% endif %}
    {% if og.image_width %}
    <meta property="og:image:width" content="{{ og.image_width }}" />
    <meta property="og:image:height" content="{{ og.image_height }}" />
    {% endif %}
    <meta property="og:image:alt" content="{{ og.title }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ og.title }}" />
    <meta name="twitter:description" content="{{ og.description }}" />
    <meta name="twitter:image" content="{{ og.image }}" />
    {% endif %}
    {% if noindex %}
    <meta name="robots" content="noindex" />
    {% endif %}
    {% if jsonld %}
    <!-- dados estruturados (schema.org) para o Google; gerados no Gruntfile -->
    <script type="application/ld+json">{{ jsonld | safe }}</script>
    {% endif %}
    <meta name="author" content="Ricardo Quintas" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- browsers sem AVIF usam as cópias .webp (geradas no build) -->
    <script src="{{ root }}assets/scripts/avif-fallback.js?v={{ v('assets/scripts/avif-fallback.js') }}"></script>
    {% if slider %}
    <link href="{{ root }}assets/css/revolution5.min.css" rel="stylesheet" type="text/css" media="all" />
    {% endif %}
    <link href="{{ root }}assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" media="all" />
    <link rel="stylesheet" href="{{ root }}assets/css/grt-youtube-popup.css">
    <link href="{{ root }}assets/css/main.min.css" rel="stylesheet" type="text/css" media="all" />
    <link href="{{ root }}assets/css/cookie-banner.css" rel="stylesheet" type="text/css" media="all" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="{{ root }}assets/css/zrq.css?v={{ v('assets/css/zrq.css') }}" rel="stylesheet" type="text/css" media="all" />
    <script src="https://kit.fontawesome.com/0c3372b073.js" crossorigin="anonymous"></script>   
        
</head>
