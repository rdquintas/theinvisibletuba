  - id: swingsmile-dance
    data: '20260417'
    name: SWING N' TUBA
    location: '''Os Combatentes'', Lisboa'
    time: '21:00'
    ticketsLink: ''
    address: 'Rua do Possolo 5-9 1350, 1350-046 Lisboa'
    mapsUrl: 'https://maps.app.goo.gl/VkJgNAxpSejSznWr'
    websiteUrl: 'https://gdecombatentes.pt'
    phone: (+351)916 395 379
    email: geral@swingnsmile.com
    info: 'Vem dançar ao som dos The Invisible Tuba! Se a tuba é invisível… o talento definitivamente não é! No dia 17 de abril, vamos encher o fantástico espaço dos Combatentes com boa música, muita energia e uma pista pronta para dançar. Se ainda não danças, aproveita a aula aberta de Lindy Hop dada pela Swing n'' Smile e descobre como é fácil começar. Depois, fica para o concerto e deixa-te levar pelo ritmo!  E se o que procuras é simplesmente boa música em Lisboa, também és mais do que bem-vindo. Vem passar uma noite diferente connosco! Programa 19h00 Abertura de Portas e DJ ''Até Terça''- 20h00 Aula aberta de Lindy Hop - 21h00-23h00 Concerto com The Invisible Tuba- 23h00-00h00 DJ ''Até Terça'''
    info_en: 'Come dance to the sounds of The Invisible Tuba! If the tuba is invisible… talent definitely isn''t! On April 17th, we''ll fill the fantastic Combatentes venue with great music, lots of energy, and a dance floor ready to go. If you don''t dance yet, take advantage of the open Lindy Hop class given by Swing n'' Smile and discover how easy it is to start. Then, stay for the concert and let yourself be carried away by the rhythm! And if what you''re looking for is simply good music in Lisbon, you''re more than welcome too. Come spend a different kind of night with us!'
