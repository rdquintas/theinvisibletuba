# data: 'yyyymmdd' (ex: '20261024'). Dia ainda por confirmar: '202610??'
#
# Cada concerto com isEnabled: true tem uma página própria:
#   dominio/concerts/<id>      (PT)
#   dominio/concerts/<id>-en   (EN)
# id: único, só letras minúsculas, números e '-'.
#   Atenção: mudar o id muda o link de um evento que já foi partilhado.
# imagem_h: hero em desktop (horizontal, ex: '/assets/img/2560_1440_v05.avif')
# imagem_v: hero em telemóvel (vertical, ex: '/assets/img/1170_2532_v00.avif')
#   Vazias = imagens por defeito (evento_imagem_h / evento_imagem_v em config.yaml).
# A imagem de partilha (og, 1200x630 jpg) é gerada automaticamente a partir da imagem_h
# em assets/img/og/ quando se corre o grunt.
# ticketsLink: preenchido = botão "Comprar Bilhetes" / "Buy Tickets" com link.
#   Vazio ('') = botão não clicável "Entrada Gratuita" / "Free Entrance".
