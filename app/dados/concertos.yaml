    mapsUrl: 'https://maps.app.goo.gl/urggvUWdxC24ZZLm8'
    websiteUrl: ''
    phone: ''
    email: ''
    info: 'Há algo que nunca aconteceu antes nas organizações: pela primeira vez, convivem quatro gerações de profissionais. Cada uma traz uma visão do mundo, uma forma de trabalhar, de comunicar e de liderar. E é neste encontro de experiências, ambições e perspetivas que se joga o futuro das empresas. A edição deste ano da Grande Conferência de Liderança Feminina convida-a a explorar este tema incontornável: a liderança através das gerações. Ao longo de um dia de inspiração, conhecimento e partilha, reuniremos mulheres que estão a dar os primeiros passos na liderança, gestoras em ascensão, CEOs, administradoras e líderes que marcaram o mundo empresarial. Histórias diferentes, percursos únicos e uma convicção comum: a liderança constrói-se todos os dias, independentemente da idade. Junte-se a nós nos dias 14 e 15 de outubro!'
    info_en: ''
